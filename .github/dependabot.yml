version: 2
updates:
  # "bun", not "npm": this repository has bun.lock and no package-lock.json,
  # so the npm updater aborted on every run from at least 2026-10-21 to
  # 2026-11-10 ("Dependabot's npm_and_yarn ecosystem cannot update
  # bun.lock") and no version update was ever proposed.
  - package-ecosystem: "bun"
    directory: "/"
    # Monthly and grouped since 2026-11-10, when the site went into
    # maintenance (AGENTS.md): one pull request a month for minor and patch
    # updates, a major one on its own. Security updates still open at once.
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    # A version must be public for 7 days before Dependabot proposes it, so a
    # compromised release has time to be found and pulled before the weekly
    # fixer merges it (AGENTS.md, maintenance mode). Security updates are not
    # delayed.
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
    # Titles read "deps: bump x from 1.0 to 1.1", the form
    # docs/agents/version-control.md asks for.
    commit-message:
      prefix: "deps"
    ignore:
      # TypeScript 7 changes how the compiler is packaged, and ESLint
      # crashes loading it (see #833). Revisit once typescript-eslint and
      # @astrojs/check support it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # prettier-plugin-astro 1.x ignores htmlWhitespaceSensitivity and
      # splits "</a>;" across lines, which renders a space before the
      # punctuation (35 pages; see #916). Revisit when upstream fixes it.
      - dependency-name: "prettier-plugin-astro"
        update-types: ["version-update:semver-major"]
