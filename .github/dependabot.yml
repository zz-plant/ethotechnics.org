version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # TypeScript 7 changes how the compiler is packaged, and ESLint
      # crashes loading it (see #833). Revisit once typescript-eslint and
      # @astrojs/check support it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # prettier-plugin-astro 1.x ignores htmlWhitespaceSensitivity and
      # splits "</a>;" across lines, which renders a space before the
      # punctuation (35 pages; see #916). Revisit when upstream fixes it.
      - dependency-name: "prettier-plugin-astro"
        update-types: ["version-update:semver-major"]
