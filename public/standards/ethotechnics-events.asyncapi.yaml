asyncapi: 2.6.0
info:
  title: Ethotechnics Events
  version: 0.3.0
  description: >-
    Draft AsyncAPI contract for contestability events and telemetry. Event payloads reuse receipt
    identifiers and clock terminology from /standards/agent-receipt-schema.json. Version 0.3.0
    adds delegation state events: grant transitions and expansion requests, policy review and
    expiry, dependency thresholds, challenges, and reconsiderations. Each event is an observation
    that changes the governing state of the system, not a notification.
servers:
  production:
    url: https://ethotechnics.org/events
    protocol: https
channels:
  decision.issued:
    description: Emitted when a decision record is issued.
    publish:
      message:
        $ref: "#/components/messages/DecisionIssued"
  appeal.opened:
    description: Emitted when an appeal is opened against a decision.
    publish:
      message:
        $ref: "#/components/messages/AppealOpened"
  pause.reversal.recorded:
    description: Emitted when a pause, reversal, or restoration is recorded.
    publish:
      message:
        $ref: "#/components/messages/PauseReversalRecorded"
  repair.completed:
    description: Emitted when a repair is completed and the decision record is updated.
    publish:
      message:
        $ref: "#/components/messages/RepairCompleted"
  burden.hours.updated:
    description: Emitted when burden hours are updated for a reporting window.
    publish:
      message:
        $ref: "#/components/messages/BurdenHoursUpdated"
  decision.deadline.reminder:
    description: Reminder emitted before a decision review or remedy clock expires.
    publish:
      message:
        $ref: "#/components/messages/DeadlineReminder"
  appeal.deadline.breached:
    description: Emitted when an appeal response deadline is missed.
    publish:
      message:
        $ref: "#/components/messages/DeadlineBreached"
  repair.log.updated:
    description: Emitted when a repair log entry is created or updated.
    publish:
      message:
        $ref: "#/components/messages/RepairLogUpdated"
  grant.state.changed:
    description: Emitted when an authority grant moves between allowed, review_required, suspended, and revoked.
    publish:
      message:
        $ref: "#/components/messages/GrantStateChanged"
  grant.expansion.requested:
    description: Emitted when a grantee or owner requests a wider scope. Expansion is a new authorization decision, not a reward for success.
    publish:
      message:
        $ref: "#/components/messages/GrantExpansionRequested"
  policy.review.triggered:
    description: Emitted when a policy review trigger fires; grants resting on the policy become eligible for reconsideration.
    publish:
      message:
        $ref: "#/components/messages/PolicyReviewTriggered"
  policy.expired:
    description: Emitted when a policy record passes expires_at without re-adoption.
    publish:
      message:
        $ref: "#/components/messages/PolicyExpired"
  dependency.threshold.crossed:
    description: Emitted when a dependency record's exposure score or a reversibility level crosses a configured threshold.
    publish:
      message:
        $ref: "#/components/messages/DependencyThresholdCrossed"
  challenge.opened:
    description: Emitted when a party with standing opens a challenge against a decision, grant, or policy.
    publish:
      message:
        $ref: "#/components/messages/ChallengeOpened"
  reconsideration.triggered:
    description: Emitted when a reconsideration is opened for a decision, grant, or policy.
    publish:
      message:
        $ref: "#/components/messages/ReconsiderationTriggered"
  reconsideration.completed:
    description: Emitted when a reconsideration records its outcome.
    publish:
      message:
        $ref: "#/components/messages/ReconsiderationCompleted"
components:
  messages:
    DecisionIssued:
      name: DecisionIssued
      title: Decision issued
      payload:
        $ref: "#/components/schemas/DecisionRecord"
      examples:
        - name: DecisionIssuedExample
          payload:
            schema_version: 1.0.0
            record_id: decision-1001
            receipt_id: receipt-9001
            issued_at: "2024-07-01T12:00:00Z"
            owner:
              name: Review Desk
              role: Case manager
              contact: support@example.org
            subject:
              id: person-442
              type: applicant
            action:
              class: benefit
              description: Housing voucher eligibility
              reversible: true
            decision:
              decision_type: denied
              reason_codes: [income_threshold]
              inputs: [income_statement_2024]
            clocks:
              ack:
                hours: 24
              review:
                hours: 72
              remedy:
                hours: 168
            evidence_refs:
              - type: policy
                href: https://ethotechnics.org/standards/std-01
    AppealOpened:
      name: AppealOpened
      title: Appeal opened
      payload:
        $ref: "#/components/schemas/AppealEvent"
      examples:
        - name: AppealOpenedExample
          payload:
            schema_version: 1.0.0
            appeal_id: appeal-220
            receipt_id: receipt-9001
            decision_id: decision-1001
            submitted_at: "2024-07-02T09:30:00Z"
            channel: web
            status: pending
            owner:
              name: Appeals Desk
              role: Appeals reviewer
              contact: appeals@example.org
    PauseReversalRecorded:
      name: PauseReversalRecorded
      title: Pause or reversal recorded
      payload:
        $ref: "#/components/schemas/PauseReversalEvent"
      examples:
        - name: PauseReversalExample
          payload:
            schema_version: 1.0.0
            event_id: pause-77
            decision_id: decision-1001
            receipt_id: receipt-9001
            event_type: reversal
            requested_at: "2024-07-02T10:10:00Z"
            owner:
              name: Case Lead
              role: Supervisor
              contact: supervisor@example.org
            reason: Evidence verified and decision overturned.
    RepairCompleted:
      name: RepairCompleted
      title: Repair completed
      payload:
        $ref: "#/components/schemas/DecisionRecord"
      examples:
        - name: RepairCompletedExample
          payload:
            schema_version: 1.0.0
            record_id: decision-1001
            receipt_id: receipt-9001
            issued_at: "2024-07-01T12:00:00Z"
            owner:
              name: Review Desk
              role: Case manager
              contact: support@example.org
            subject:
              id: person-442
              type: applicant
            action:
              class: benefit
              description: Housing voucher eligibility
              reversible: true
            decision:
              decision_type: approved
              reason_codes: [appeal_remedy]
              inputs: [appeal_packet_2024]
            clocks:
              ack:
                hours: 24
              review:
                hours: 72
              remedy:
                hours: 168
            status: remedied
            evidence_refs:
              - type: remedy
                href: https://ethotechnics.org/standards/repair-sla.schema.json
    BurdenHoursUpdated:
      name: BurdenHoursUpdated
      title: Burden hours updated
      payload:
        $ref: "#/components/schemas/BurdenHours"
      examples:
        - name: BurdenHoursExample
          payload:
            schema_version: 1.0.0
            record_id: burden-2024-q2
            period_start: "2024-04-01"
            period_end: "2024-06-30"
            scope: housing-appeals
            total_hours: 820.5
            unit: hours
            population:
              count: 240
              segment: applicants
    DeadlineReminder:
      name: DeadlineReminder
      title: Decision deadline reminder
      payload:
        $ref: "#/components/schemas/DeadlineEvent"
      examples:
        - name: DeadlineReminderExample
          payload:
            decision_id: decision-1001
            receipt_id: receipt-9001
            clock_type: review
            due_at: "2024-07-05T12:00:00Z"
            status: reminder
    DeadlineBreached:
      name: DeadlineBreached
      title: Appeal deadline breached
      payload:
        $ref: "#/components/schemas/DeadlineEvent"
      examples:
        - name: DeadlineBreachedExample
          payload:
            decision_id: decision-1001
            receipt_id: receipt-9001
            clock_type: appeal
            due_at: "2024-07-03T12:00:00Z"
            status: breached
    RepairLogUpdated:
      name: RepairLogUpdated
      title: Repair log updated
      payload:
        $ref: "#/components/schemas/RepairEvent"
      examples:
        - name: RepairLogUpdatedExample
          payload:
            repair_id: repair-55
            decision_id: decision-1001
            updated_at: "2024-07-02T12:30:00Z"
            status: in_progress
    GrantStateChanged:
      name: GrantStateChanged
      title: Grant state changed
      payload:
        $ref: "#/components/schemas/GrantStateEvent"
      examples:
        - name: GrantNarrowedAfterChallenge
          payload:
            grant_id: GRANT-2026-0142
            grantee_id: agent-risk-ops-v2
            from: review_required
            to: allowed
            reason: challenge
            evidence_ref: REC-2026-0019
            at: "2026-06-18T16:30:00Z"
    GrantExpansionRequested:
      name: GrantExpansionRequested
      title: Grant expansion requested
      payload:
        $ref: "#/components/schemas/GrantExpansionEvent"
      examples:
        - name: GrantExpansionExample
          payload:
            grant_id: GRANT-2026-0142
            grantee_id: agent-risk-ops-v2
            requested_by: fraud-operations-lead
            requested_at: "2026-08-20T09:00:00Z"
            requested_scope:
              action_classes: [READ, WRITE]
              systems: [core-banking-holds]
              populations: ["retail accounts", "business accounts"]
            justification: "Six months without a reversed hold on retail; business queue backlog exceeds 8 hours."
    PolicyReviewTriggered:
      name: PolicyReviewTriggered
      title: Policy review triggered
      payload:
        $ref: "#/components/schemas/PolicyReviewEvent"
      examples:
        - name: PolicyReviewExample
          payload:
            policy_id: POL-FRAUD-HOLD-3.2
            version: 3.2.0
            trigger_id: TRG-FPR-30D
            kind: evidence_threshold
            observed: "false_positive_hold_rate_30d = 0.024"
            action: review_required
            at: "2026-06-11T08:00:00Z"
            affected_grants: [GRANT-2026-0142]
    PolicyExpired:
      name: PolicyExpired
      title: Policy expired
      payload:
        $ref: "#/components/schemas/PolicyExpiredEvent"
      examples:
        - name: PolicyExpiredExample
          payload:
            policy_id: POL-FRAUD-HOLD-3.1
            version: 3.1.0
            expired_at: "2026-02-15T00:00:00Z"
            superseded_by: POL-FRAUD-HOLD-3.2
            affected_grants: []
    DependencyThresholdCrossed:
      name: DependencyThresholdCrossed
      title: Dependency threshold crossed
      payload:
        $ref: "#/components/schemas/DependencyThresholdEvent"
      examples:
        - name: DependencyThresholdExample
          payload:
            dependency_id: DEP-RISK-OPS-V2-2026-06
            system_ref: agent-risk-ops-v2
            metric: exposure_score
            threshold: 2000
            observed: 2418
            direction: above
            at: "2026-06-15T00:00:00Z"
    ChallengeOpened:
      name: ChallengeOpened
      title: Challenge opened
      payload:
        $ref: "#/components/schemas/Challenge"
      examples:
        - name: ChallengeOpenedExample
          payload:
            schema_version: 1.0.0
            challenge_id: CHL-2026-0088
            register_ref: REG-ACCOUNT-HOLDS-1
            decision_class: account_hold
            subject:
              kind: grant
              ref: GRANT-2026-0142
            challenger:
              standing_basis: affected_party
              id: acct-7731-representative
            opened_at: "2026-06-10T14:20:00Z"
            evidence:
              - type: vulnerability_flag
                href: https://cases.example.org/acct-7731/vulnerability-flag
            responder:
              name: Risk Steward on call
              role: Risk Steward
              contact: risk-steward@example.org
            deadline: "2026-06-12T14:20:00Z"
            status: open
    ReconsiderationTriggered:
      name: ReconsiderationTriggered
      title: Reconsideration triggered
      payload:
        $ref: "#/components/schemas/Reconsideration"
      examples:
        - name: ReconsiderationTriggeredExample
          payload:
            schema_version: 1.0.0
            reconsideration_id: REC-2026-0019
            trigger:
              kind: challenge
              ref: CHL-2026-0088
            subject:
              kind: grant
              ref: GRANT-2026-0142
            opened_at: "2026-06-11T10:00:00Z"
            outcome: pending
            evidence_delta: "Challenge asserts the account was flagged vulnerable before the hold."
            decided_by: Risk Governance Board
    ReconsiderationCompleted:
      name: ReconsiderationCompleted
      title: Reconsideration completed
      payload:
        $ref: "#/components/schemas/Reconsideration"
      examples:
        - name: ReconsiderationCompletedExample
          payload:
            schema_version: 1.0.0
            reconsideration_id: REC-2026-0019
            trigger:
              kind: challenge
              ref: CHL-2026-0088
            subject:
              kind: grant
              ref: GRANT-2026-0142
            opened_at: "2026-06-11T10:00:00Z"
            decided_at: "2026-06-18T16:30:00Z"
            outcome: narrow
            evidence_delta: "False-positive rate on flagged accounts was 11% against a 2% assumption."
            decided_by: Risk Governance Board
            resulting_refs: [GRANT-2026-0142]
  schemas:
    DecisionRecord:
      $ref: https://ethotechnics.org/standards/decision-record.schema.json
    AppealEvent:
      $ref: https://ethotechnics.org/standards/appeal-event.schema.json
    PauseReversalEvent:
      $ref: https://ethotechnics.org/standards/pause-reversal.schema.json
    BurdenHours:
      $ref: https://ethotechnics.org/standards/burden-hours.schema.json
    Challenge:
      $ref: https://ethotechnics.org/standards/challenge.schema.json
    Reconsideration:
      $ref: https://ethotechnics.org/standards/reconsideration.schema.json
    GrantStateEvent:
      type: object
      required: [grant_id, grantee_id, from, to, reason, at]
      properties:
        grant_id:
          type: string
        grantee_id:
          type: string
        from:
          type: string
          enum: [none, allowed, review_required, suspended, revoked]
        to:
          type: string
          enum: [allowed, review_required, suspended, revoked]
        reason:
          type: string
          enum:
            - issued
            - renewal
            - expansion
            - evidence_changed
            - policy_review
            - challenge
            - incident
            - expiry
            - manual
        evidence_ref:
          type: string
        at:
          type: string
          format: date-time
    GrantExpansionEvent:
      type: object
      required:
        [
          grant_id,
          grantee_id,
          requested_by,
          requested_at,
          requested_scope,
          justification,
        ]
      properties:
        grant_id:
          type: string
        grantee_id:
          type: string
        requested_by:
          type: string
        requested_at:
          type: string
          format: date-time
        requested_scope:
          type: object
          properties:
            action_classes:
              type: array
              items:
                type: string
            systems:
              type: array
              items:
                type: string
            populations:
              type: array
              items:
                type: string
        justification:
          type: string
    PolicyReviewEvent:
      type: object
      required: [policy_id, version, trigger_id, kind, action, at]
      properties:
        policy_id:
          type: string
        version:
          type: string
        trigger_id:
          type: string
        kind:
          type: string
          enum:
            - evidence_threshold
            - elapsed_time
            - incident_class
            - dependency_threshold
            - challenge_volume
        observed:
          type: string
        action:
          type: string
          enum: [review_required, suspend, retire]
        at:
          type: string
          format: date-time
        affected_grants:
          type: array
          items:
            type: string
    PolicyExpiredEvent:
      type: object
      required: [policy_id, version, expired_at]
      properties:
        policy_id:
          type: string
        version:
          type: string
        expired_at:
          type: string
          format: date-time
        superseded_by:
          type: string
        affected_grants:
          type: array
          items:
            type: string
    DependencyThresholdEvent:
      type: object
      required:
        [dependency_id, system_ref, metric, threshold, observed, direction, at]
      properties:
        dependency_id:
          type: string
        system_ref:
          type: string
        metric:
          type: string
          enum:
            - exposure_score
            - dependency_depth
            - substitution_cost
            - correction_latency
            - reversibility.operational
            - reversibility.institutional
        threshold:
          type: number
        observed:
          type: number
        direction:
          type: string
          enum: [above, below]
        at:
          type: string
          format: date-time
    DeadlineEvent:
      type: object
      required:
        - decision_id
        - receipt_id
        - clock_type
        - due_at
        - status
      properties:
        decision_id:
          type: string
        receipt_id:
          type: string
        appeal_id:
          type: string
        clock_type:
          type: string
          enum: [ack, review, remedy, appeal]
        due_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [reminder, breached]
    RepairEvent:
      type: object
      required:
        - repair_id
        - decision_id
        - updated_at
        - status
      properties:
        repair_id:
          type: string
        decision_id:
          type: string
        appeal_id:
          type: string
        updated_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [opened, in_progress, resolved]
        notes:
          type: string
