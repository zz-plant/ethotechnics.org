[test]
# Coverage is opt-in (`bun run test:unit:ci`), so a focused test run prints
# results and not a per-file coverage table.
# Coverage directory for CI integration
coverageDir = "./coverage"
# Preload files for test setup
preload = ["./src/test/preload.ts"]

[run]
# Enable source maps for better stack traces
sourcemap = true

[install]
# No global frozenLockfile. CI, the hooks and the docs run
# `bun install --frozen-lockfile` explicitly, so their installs stay
# reproducible. Set here, it also froze `bun update`, and every Dependabot
# version update failed with "lockfile had changes, but lockfile is frozen"
# (seen 2026-11-10).
# Automatically install peer dependencies
peer = true
