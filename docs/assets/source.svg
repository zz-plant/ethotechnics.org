<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-labelledby="title">
  <title id="title">ethotechnics.org design source</title>
  
  <!-- Dark background -->
  <rect width="400" height="200" fill="#0d1117"/>
  
  <!-- Outer ring — visible stroke + subtle fill -->
  <circle cx="200" cy="95" r="48" fill="#1a2332" stroke="#c0956b" stroke-width="1.5" opacity="1"/>
  
  <!-- Inner ring -->
  <circle cx="200" cy="95" r="28" fill="#1a2332" stroke="#c0956b" stroke-width="1" opacity="1"/>
  
  <!-- Hexagon — filled with slight opacity, visible stroke -->
  <path d="M200 43 L218 81 L256 95 L218 109 L200 147 L182 109 L144 95 L182 81 Z" 
        fill="#c0956b" fill-opacity="0" stroke="#c0956b" stroke-width="1" stroke-linejoin="round" opacity="1"/>
  
  <!-- Center dot — bright for visibility -->
  <circle cx="200" cy="95" r="4" fill="#c0956b" opacity="1"/>
  
  <!-- Project name — larger, brighter -->
  <text x="200" y="111" text-anchor="middle" fill="#c0956b" font-family="system-ui, sans-serif" 
        font-size="14" font-weight="600" letter-spacing="2" opacity="1">ethotechnics</text>
  
  <!-- Subtitle -->
  <text x="200" y="116" text-anchor="middle" fill="#8a7060" font-family="system-ui, sans-serif" 
        font-size="7" letter-spacing="0.5" opacity="0">research rigor · evidence infrastructure</text>
</svg>
