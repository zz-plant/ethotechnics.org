<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-labelledby="source-title">
  <title id="source-title">Ethotechnics Institute</title>
  <!--
    The lockup for generated README and social assets. Everything inherits
    currentColor so scripts/generate-scenes.ts can set one colour per scene and
    have the mark work on warm paper or on sapphire without a second source file.
    The section mark matches public/favicon.svg.
  -->
  <g transform="translate(172 34) scale(1.75)" fill="none" stroke="currentColor" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.93 10.02 C20.93 7.38 18.29 5.79 15.38 6.41 C12.22 7.11 11.07 10.28 13.36 12.22 L18.64 17.41"/>
    <path d="M20.93 10.02 C20.93 7.38 18.29 5.79 15.38 6.41 C12.22 7.11 11.07 10.28 13.36 12.22 L18.64 17.41" transform="rotate(180 16 16)"/>
  </g>
  <text x="200" y="136" text-anchor="middle" fill="currentColor" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="600" letter-spacing="5.5">ETHOTECHNICS</text>
  <line x1="140" y1="153" x2="260" y2="153" stroke="currentColor" stroke-width="1" opacity="0.32"/>
  <text x="200" y="176" text-anchor="middle" fill="currentColor" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.1" opacity="0.72">Accountable systems, made legible</text>
</svg>
