# yaml-language-server: $schema=node_modules/wrangler/config-schema.json
name = "et3"
compatibility_date = "2025-12-03"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist/client"
binding = "ASSETS"

# Preview environment for staging deployments
[env.preview]
name = "et3-preview"

# Observability settings
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[[unsafe.bindings]]
name = "NEWSLETTER_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Shared diagnostic readouts (/api/readouts, /readouts/[id]). Locally the
# platform proxy backs this with a Miniflare namespace, so `bun run dev`
# works without an account. Before the first deploy, create the namespace and
# replace the id:
#   bunx wrangler kv namespace create READOUTS
[[kv_namespaces]]
binding = "READOUTS"
id = "df8619fc007d44c4a5bb956f211a8fe4"

[[unsafe.bindings]]
name = "READOUT_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
